spring:
  config:
    import: optional:file:.env[.properties]

  jackson:
    deserialization:
      accept-float-as-int: false

  application:
    name: calories-detect-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:calories_detect}}
    username: ${DB_USERNAME:calories_user}
    password: ${DB_PASSWORD:calories_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

app:
  google:
    client-id: ${GOOGLE_CLIENT_ID}
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:24h}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:7d}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
