spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  config:
    import: optional:file:.env[.properties]

  jackson:
    deserialization:
      accept-float-as-int: false

  application:
    name: calories-detect-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:calories_detect}}
    username: ${DB_USERNAME:calories_user}
    password: ${DB_PASSWORD:calories_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

app:
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    connect-timeout: ${AI_SERVICE_CONNECT_TIMEOUT:3s}
    response-timeout: ${AI_SERVICE_RESPONSE_TIMEOUT:75s}
  auth:
    secure-cookies: ${AUTH_SECURE_COOKIES:false}
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:15m}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:7d}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}

server:
  tomcat:
    # Drain rejected uploads so clients can read the JSON 413 response.
    max-swallow-size: 8MB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true
    with-credentials: true

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
